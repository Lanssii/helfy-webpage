<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctorabs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a href="index.html"
        ><img src="images/logo.svg" alt="doctorabs-logo"
      /></a>
    </header>

    <section class="hero">
      <div class="hero-left"><img src="images/hero.png" alt="" /></div>
      <div class="hero-right">
        <h1 class="hero-title">Online-Arzt- und Apothekenservice</h1>
        <p class="hero-description">
          Behandlungen online verschrieben und nach Hause geliefert
        </p>

        <div class="description-list">
          <div>
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="18" height="18" rx="9" fill="#154B3E" />
              <path
                d="M13 6L7.8125 11.1875L5 8.375"
                stroke="white"
                stroke-width="1.125"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <p>Schneller und <strong>diskreter Service</strong></p>
          </div>
          <div>
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="18" height="18" rx="9" fill="#154B3E" />
              <path
                d="M13 6L7.8125 11.1875L5 8.375"
                stroke="white"
                stroke-width="1.125"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <p>Rezept und <strong>Behandlung online</strong> </p>
          </div>
          <div>
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="18" height="18" rx="9" fill="#154B3E" />
              <path
                d="M13 6L7.8125 11.1875L5 8.375"
                stroke="white"
                stroke-width="1.125"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <p>Selbstabholung in <strong>600+ Apotheken</strong></p>
          </div>
          <div>
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="18" height="18" rx="9" fill="#154B3E" />
              <path
                d="M13 6L7.8125 11.1875L5 8.375"
                stroke="white"
                stroke-width="1.125"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>

            <p>
              Expresslieferung ab <strong>60 Min</strong>
              <span>*je nach Standort</span>
            </p>
          </div>
        </div>

        <button>Jetzt Rezept anfordern!</button>

        <div class="rating">
          <img
            class="rating-logo"
            src="images/rating-icon.svg"
            alt="rating-logo"
          />

          <div class="rating-info">
            <div class="rating-stars-row">
              <p class="rating-title">Käuferschutz</p>
              <div class="rating-stars">
                <svg
                  width="21"
                  height="20"
                  viewBox="0 0 21 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M3.86768 19.212L5.51081 12.1086L0 7.33089L7.28034 6.69892L10.1116 0L12.9428 6.69892L20.2232 7.33089L14.7123 12.1086L16.3555 19.212L10.1116 15.4454L3.86768 19.212Z"
                    fill="#FDDA30"
                  />
                </svg>
                <svg
                  width="21"
                  height="20"
                  viewBox="0 0 21 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M3.86768 19.212L5.51081 12.1086L0 7.33089L7.28034 6.69892L10.1116 0L12.9428 6.69892L20.2232 7.33089L14.7123 12.1086L16.3555 19.212L10.1116 15.4454L3.86768 19.212Z"
                    fill="#FDDA30"
                  />
                </svg>
                <svg
                  width="21"
                  height="20"
                  viewBox="0 0 21 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M3.86768 19.212L5.51081 12.1086L0 7.33089L7.28034 6.69892L10.1116 0L12.9428 6.69892L20.2232 7.33089L14.7123 12.1086L16.3555 19.212L10.1116 15.4454L3.86768 19.212Z"
                    fill="#FDDA30"
                  />
                </svg>
                <svg
                  width="21"
                  height="20"
                  viewBox="0 0 21 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M3.86768 19.212L5.51081 12.1086L0 7.33089L7.28034 6.69892L10.1116 0L12.9428 6.69892L20.2232 7.33089L14.7123 12.1086L16.3555 19.212L10.1116 15.4454L3.86768 19.212Z"
                    fill="#FDDA30"
                  />
                </svg>
                <svg
                  width="21"
                  height="20"
                  viewBox="0 0 21 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M3.86768 19.212L5.51081 12.1086L0 7.33089L7.28034 6.69892L10.1116 0L12.9428 6.69892L20.2232 7.33089L14.7123 12.1086L16.3555 19.212L10.1116 15.4454L3.86768 19.212Z"
                    fill="#FDDA30"
                  />
                </svg>
              </div>
            </div>

            <p class="rating-score">
              <span class="rating-number"> 4,81</span> Sehr gut
            </p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
